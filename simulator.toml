consortium_profile = "transit-good"
validity_hours = 24
[[sla_templates.path]]
isd_as = "1-ff00:0:120"
ingress = 0
egress = 102
[[sla_templates.path]]
isd_as = "1-ff00:0:130"
ingress = 202
egress = 0
[sla_templates.bounds]
latency_max_ms = 11
loss_max_ppm = 300
bandwidth_min_kbps = 6_000_000

