[server]
bind_host = "0.0.0.0"
bind_port = 8081

[aggregator]
url = "http://127.0.0.1:8080"

[simulation]
tick_interval_seconds = 3.0
initial_sla_count = 10
path_discovery = "static"

# ----------------------------- ASes ---------------------------------------
# Six transit ASes that cover the two static paths defined in
# scion-topology/static_paths.yaml: 112→120→130 and 112→121→140.
# Two edge buyers keep the claim feed busy.

[[generic_ases]]
isd_as = "1-ff00:0:111"
role = "transit-good"
quality_profile = "transit-good"
[generic_ases.policy]
max_price_per_gb = "1.00"
min_reputation_floor = 0.0
alpha = 1.0
beta = 1.0
uncovered_tolerance = "anywhere"
complaint_sensitivity = "moderate"
reshop_on_reputation_drop = 1.0
portfolio_redundancy = 0

