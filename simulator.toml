# --------------------------------------------------------------------------
# v2.1 additions — templates that actually cover the user's default paths.
# The coverage matcher slides cosigner sequences over path AS sequences, so
# the templates below are authored to match real windows of the two paths:
#
#   112 -> 130           (Path A, direct)
#   112 -> 111 -> 120 -> 130   (Path B, long)
#   112 -> 130 -> 131 -> 132 -> 133  (Path A' to Helsinki)
#   112 -> 111 -> 120 -> 130 -> 131 -> 132 -> 133  (Path B' to Helsinki)
# --------------------------------------------------------------------------

# Path A direct cover: [112, 130]. 112 is the source (first cosigner), so
# self-dealing allows the user's 112 agent to claim this SLA; the simulator
# signs as 112 because the user's key is available to it. Premium variant
# (transit-premium quality, tighter bounds) — matches §7.4.
[[sla_templates]]
price_per_gb = "0.065"
consortium_profile = "transit-premium"
validity_hours = 24
[[sla_templates.path]]
isd_as = "1-ff00:0:112"
ingress = 0
egress = 101
[[sla_templates.path]]
isd_as = "1-ff00:0:130"
ingress = 201
egress = 0
[sla_templates.bounds]
latency_max_ms = 5
loss_max_ppm = 90
bandwidth_min_kbps = 11_000_000

# Full cover for the long Path B: [112, 111, 120, 130]. 112 is the source
