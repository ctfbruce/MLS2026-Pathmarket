# Cosigner-only participants never buy SLAs (their policy below rejects
# everything via min_reputation_floor=1.0). 131 is a transit on the Helsinki
# trunk. 112 is the user's own AS — the simulator signs as 112 when a template
# places 112 at the *source* position; the relaxed self-dealing rule
# (aggregator/validation.py Step 5) lets the user's 112 user-agent claim
# SLAs where 112 is the first cosigner.

[[generic_ases]]
isd_as = "1-ff00:0:131"
role = "cosigner-only"
quality_profile = "transit-good"
[generic_ases.policy]
max_price_per_gb = "0.00"
min_reputation_floor = 1.0
alpha = 1.0
beta = 1.0
uncovered_tolerance = "anywhere"
complaint_sensitivity = "moderate"
reshop_on_reputation_drop = 1.0
portfolio_redundancy = 0

[[generic_ases]]
isd_as = "1-ff00:0:112"
